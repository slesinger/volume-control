substitutions:
  # Volume range (dB) that HA sees: the number slider and the media_player 0..1 volume map onto 0..ha_volume_range.
  # Deliberately lower than the speakers' 120 dB maximum so a stray slider drag cannot go loud.
  ha_volume_range: "60"

esphome:
  name: volume-control
  platformio_options:
    build_flags:
      - -DUSER_SETUP_LOADED=1
      - -DST7789_DRIVER=1
      - -DTFT_WIDTH=240
      - -DTFT_HEIGHT=240
      - -std=gnu++14
      - -DTFT_MOSI=23
      - -DTFT_SCLK=18
      - -DTFT_CS=-1    # CS pin not used
      - -DTFT_DC=16    # Data Command control pin
      - -DTFT_RST=4    # Reset pin
      - -DLOAD_GLCD=1  # Load default font - keep for fallback
      - -DLOAD_FONT2=1 # Load smooth Font2 - smaller font for header
      - -DLOAD_FONT4=1 # Load smooth Font4 - main UI font
      - -DLOAD_FONT8=1 # Load smooth Font8 - volume display
      - -DSPI_FREQUENCY=40000000
      - -DDISABLE_ALL_LIBRARY_WARNINGS=1  # Disable the touch CS warning
      - -Isrc # Base source directory
      - -Isrc/esphome/components/api
      - -Isrc/esphome/components/binary_sensor
      - -Isrc/esphome/components/logger
      - -Isrc/esphome/components/ota
      - -Isrc/esphome/components/psram
      - -Isrc/esphome/components/wifi
      - -Isrc/esphome/components/spi              # The MOST IMPORTANT one

globals:
  - id: updating_from_sensor
    type: bool
    initial_value: 'false'

esp32:
  board: lolin32
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true  # skip the scan of all channels, saves seconds at boot (single access point at home)

network:
    enable_ipv6: true
    min_ipv6_addr_count: 2

logger:
  level: INFO
  # Available levels: NONE, ERROR, WARN, INFO, DEBUG, VERBOSE
  # Set to NONE to completely disable logging
  # Set to ERROR for minimal logging
  # Set to INFO for normal logging without debug messages

psram:

api:
  encryption:
    key: !secret encryption_key
  services:
    - service: set_volume
      variables:
        level: float
      then:
        - lambda: 'id(my_vol_ctrl).set_volume_from_hass(level);'
    
    - service: toggle_mute
      then:
        - lambda: 'id(my_vol_ctrl).toggle_mute();'
    
    - service: set_display_brightness
      variables:
        brightness: int
      then:
        - lambda: 'id(my_vol_ctrl).set_display_brightness(brightness);'

    - service: deep_sleep
      then:
        - lambda: 'id(my_vol_ctrl).deep_sleep();'

    - service: cycle_input
      then:
        - lambda: 'id(my_vol_ctrl).cycle_input();'

    - service: set_input
      variables:
        input: string
      then:
        - lambda: 'id(my_vol_ctrl).set_input(input);'

    - service: pause
      then:
        - lambda: 'id(my_vol_ctrl).pause();'

    - service: next
      then:
        - lambda: 'id(my_vol_ctrl).next();'

    - service: previous
      then:
        - lambda: 'id(my_vol_ctrl).previous();'

    - service: mute
      then:
        - lambda: 'id(my_vol_ctrl).mute();'

    - service: unmute
      then:
        - lambda: 'id(my_vol_ctrl).unmute();'

    - service: volume_up
      variables:
        diff: float
      then:
        - lambda: 'id(my_vol_ctrl).volume_change_from_hass(diff);'

    - service: volume_down
      variables:
        diff: float
      then:
        - lambda: 'id(my_vol_ctrl).volume_change_from_hass(-diff);'

ota:
  platform: esphome
  password: !secret ota_password

spi:
  id: spi1
  clk_pin: GPIO18
  mosi_pin: GPIO23

packages:
  time: !include time.yaml

external_components:
  - source:
      type: local
      path: custom_components

# Use our custom component
output:
  - platform: ledc
    id: backlight_output
    pin: GPIO17
    frequency: 1000Hz
    min_power: 0.1
    zero_means_zero: true  # set_level(0) = really off (else it would stay at min_power); used for deep sleep
    max_power: 1.0

vol_ctrl:
  id: my_vol_ctrl
  spi_id: spi1
  backlight_pin: backlight_output
  wiim_ip: auto  # WiiM streamer: IPv4 address, or auto to find it via SSDP; remove the line to disable WiiM features
  encoder_pin_a: GPIO26
  encoder_pin_b: GPIO27
  # Entries of the "Home Assistant" menu. Each one fires an event that a Home Assistant automation can react to
  # (trigger: Event, type esphome.volume_control_action, event data action: lights_off). Edit freely.
  quick_actions:
    - name: "Lights off"
      then:
        - homeassistant.event:
            event: esphome.volume_control_action
            data:
              action: lights_off
    - name: "Movie mode"
      then:
        - homeassistant.event:
            event: esphome.volume_control_action
            data:
              action: movie_mode
  max_volume: 100  # dB, soft cap for every volume sent to the speakers (hardware maximum is 120)

sensor:
  - platform: template
    name: "Current Volume"
    id: current_volume_sensor
    unit_of_measurement: "dB"
    accuracy_decimals: 1
    state_class: measurement
    device_class: sound_pressure
    update_interval: 2s
    lambda: |-
      float volume = id(my_vol_ctrl).get_volume();
      if (volume >= 0.0f)
        return volume;
      return {};
    on_value:
      then:
        - lambda: |-
            // Keep the media player slider in sync with the real speaker volume
            float fraction = std::min(std::max(x / ${ha_volume_range}, 0.0f), 1.0f);
            float current = id(media_player_volume_control)->volume;
            if (isnan(current) || fabs(current - fraction) > 0.01f) {
              id(updating_from_sensor) = true;
              auto call = id(media_player_volume_control)->make_call();
              call.set_volume(fraction);
              call.perform();
            }
        - delay: 100ms
        - lambda: 'id(updating_from_sensor) = false;'

binary_sensor:
  - platform: gpio
    pin: 
      number: GPIO25
      mode: INPUT_PULLUP
    name: "Encoder Button"
    id: encoder_button
    filters:
      - invert:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      then:
        - lambda: 'id(my_vol_ctrl).button_pressed();'
    on_release:
      then:
        - lambda: 'id(my_vol_ctrl).button_released();'

  # Extra push buttons: A = cycle WiiM input, B = play/pause, C = next track
  - platform: gpio
    pin:
      number: GPIO32
      mode: INPUT_PULLUP
    name: "Push Button A"
    id: push_button_a
    filters:
      - invert:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - lambda: 'id(my_vol_ctrl).cycle_input();'

  - platform: gpio
    pin:
      number: GPIO33
      mode: INPUT_PULLUP
    name: "Push Button B"
    id: push_button_b
    filters:
      - invert:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - lambda: 'id(my_vol_ctrl).pause();'

  - platform: gpio
    pin:
      number: GPIO14
      mode: INPUT_PULLUP
    name: "Push Button C"
    id: push_button_c
    filters:
      - invert:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - lambda: 'id(my_vol_ctrl).next();'

  - platform: template
    name: "Speaker Muted"
    id: speaker_muted_sensor
    lambda: 'return id(my_vol_ctrl).is_muted();'

number:
  - platform: template
    name: "Volume Level"
    id: volume_level_number
    min_value: 0
    max_value: ${ha_volume_range}
    step: 1
    unit_of_measurement: "dB"
    mode: slider
    update_interval: 2s
    lambda: |-
      float volume = id(my_vol_ctrl).get_volume();
      if (volume >= 0.0f)
        return volume;
      return {};
    set_action:
      then:
        - lambda: 'id(my_vol_ctrl).set_volume_from_hass(x);'

# Fake media player (dummy I2S pins, nothing is played) so Home Assistant gets a native volume slider.
i2s_audio:
  i2s_lrclk_pin: GPIO13  # fake pin
  i2s_bclk_pin: GPIO21   # fake pin

media_player:
  - platform: i2s_audio
    name: "Volume Control"
    dac_type: external
    i2s_dout_pin: GPIO22  # fake pin
    id: media_player_volume_control
    on_state:
      - if:
          condition:
            lambda: |-
              // Ignore our own programmatic updates (see the volume sensor below)
              float v = id(media_player_volume_control)->volume;
              return !id(updating_from_sensor) && !isnan(v) && v >= 0.0f;
          then:
            - lambda: |-
                float volume_db = id(media_player_volume_control)->volume * ${ha_volume_range};
                ESP_LOGI("media_player", "Volume changed from Home Assistant: %.1f dB", volume_db);
                id(my_vol_ctrl).set_volume_from_hass(volume_db);

text_sensor:
  - platform: template
    name: "Current Audio Input"
    id: current_audio_input_sensor
    update_interval: 5s
    lambda: |-
      std::string input = id(my_vol_ctrl).get_current_input();
      if (input.empty())
        return {};
      return input;

select:
  - platform: template
    name: "Audio Input"
    id: audio_input_select
    optimistic: false
    options:
      - "Network"
      - "Bluetooth"
      - "Line-In"
      - "Optical"
    update_interval: 5s
    lambda: |-
      std::string input = id(my_vol_ctrl).get_current_input();
      if (input.empty())
        return {};
      return input;
    set_action:
      - lambda: 'id(my_vol_ctrl).set_input(x);'

button:
  - platform: template
    name: "Cycle Input"
    on_press:
      - lambda: 'id(my_vol_ctrl).cycle_input();'

  - platform: template
    name: "Play Pause"
    on_press:
      - lambda: 'id(my_vol_ctrl).pause();'

  - platform: template
    name: "Next Track"
    on_press:
      - lambda: 'id(my_vol_ctrl).next();'
